name: Atualizar cartão de atividade

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar cartão de atividade
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: node .github/scripts/generate-profile-stats.mjs

      - name: Salvar cartão atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git commit -m "Atualiza cartão de atividade" || exit 0
          git push
